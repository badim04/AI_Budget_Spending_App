name = "finlo-llm-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

# Optional but recommended: per-IP rate limiting.
# Create it with:  npx wrangler kv namespace create RATE_LIMIT
# then paste the printed id below and uncomment.
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "paste_the_id_here"

[vars]
# Kill switch: set to "1" and redeploy to turn the feature off everywhere.
DISABLED = "0"
# Leave empty in production so browsers cannot call this at all.
# For local web testing set it to "http://localhost:8081".
ALLOWED_ORIGIN = ""

# GEMINI_API_KEY and APP_TOKEN are secrets, never vars. Set them with:
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put APP_TOKEN
